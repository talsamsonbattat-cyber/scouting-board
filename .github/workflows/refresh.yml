name: weekly-data-refresh

on:
  schedule:
    # Tuesdays 12:00 UTC (early morning US) during and after game weeks
    - cron: "0 12 * * 2"
  workflow_dispatch: {}   # manual "run now" button in the Actions tab

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install requests pandas
      - name: Build data
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        # --with-games-current derives games_played for this season only
        # (adds ~135 API calls). Remove the flag if you're tight on quota.
        run: python cfbd_full_pipeline.py --with-games-current
      - name: Commit refreshed data
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "weekly data refresh $(date -u +%F)"
          git push
